<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>オープン保育ICT — Windows かんたん導入</title>
  <link rel="stylesheet" href="style.css"><script src="views.js" defer></script><script src="wizard.js" defer></script>
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true">育</span><div>オープン保育ICT<small>Windows かんたん導入</small></div><span class="beta-tag">このPC → 園内 → 園外</span></header>
  <main class="layout">
    <aside class="guide"><p class="eyebrow">使う範囲を、ひとつずつ。</p><h1>このPCから、<br>園内、そして園外へ。</h1><p>同じアプリで、導入から<br>接続の管理まで進めます。</p><ol id="steps" aria-label="導入の手順"></ol><div class="guide-note">確認画面で実行するまでは、利用範囲を変更しません。</div></aside>
    <section class="card" id="wizard" aria-label="導入ウィザード"><h2>導入状態を確認しています</h2></section>
  </main>
  <footer class="page-footer">Windows 11 x64 ・ この画面は実際の導入・接続設定を行います。<br>園内サーバーは、この画面を閉じた後も動作します。<br><button type="button" class="link-button" id="exit">導入アプリを終了</button></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="buttons"><button class="secondary" id="dialog-back" type="button">戻る</button><button class="primary" id="dialog-confirm" type="button"></button></div></dialog>
</body>
</html>
