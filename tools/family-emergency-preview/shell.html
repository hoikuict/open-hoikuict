<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>園児ごとの緊急連絡先｜操作モック</title>
<style><!--UTILITIES--></style><style><!--CSS--></style></head>
<body>
<header class="lab"><div class="lab-wrap">
  <div class="lab-id"><b>操作モック</b><span>架空の家族で試せます</span></div>
  <nav aria-label="試用する画面"><a id="parent-tab" href="#home">保護者画面</a><a id="staff-tab" href="#children">職員画面</a></nav>
  <details id="settings"><summary>試用設定</summary><div class="options">
    <label>初回登録を試す家庭<select id="family-example"><option value="standard">母と父</option><option value="unknown">続柄が未登録</option><option value="single">保護者が一人</option><option value="single-extra">保護者が一人・祖母の連絡先あり</option><option value="partial">職場の番号が一部未登録</option></select></label>
    <label>保護者<select id="actor"><option value="母">母</option><option value="父">父</option></select></label>
    <label>この保護者が見られる園児<select id="scope"><option value="both">あおい・ひなた</option><option value="1">あおいのみ</option><option value="2">ひなたのみ</option><option value="none">紐付けなし</option></select></label>
    <label>職員の権限<select id="staff-role"><option value="edit">編集可</option><option value="read">閲覧のみ</option></select></label>
    <label>今日として試す日<input type="date" id="clock" value="2026-11-09"></label>
    <label>見本の園の閉園時刻<input type="time" id="closing" min="00:01" max="23:59" required value="19:00"></label>
    <label>見本の状態<select id="scenario"><option value="empty">未入力</option><option value="usual">いつもどおりと回答済み</option><option value="changed">祖母を最初に・夕食も入力済み</option><option value="partial">一部入力・夕食は内容だけ</option><option value="error">入力エラー・祖母の番号が空</option><option value="unregistered">いつもの順番が未登録</option></select></label>
    <button type="button" id="apply-example">試用データをこの状態に戻す</button>
    <button type="button" id="race" hidden>別の保護者が先に保存した状態を試す</button>
  </div></details>
</div></header>
<div id="appbar"></div><main id="main"></main><div id="status" class="toast" role="status" hidden></div>
<template id="home-template"><!--HOME--></template>
<template id="daily-template"><!--DAILY--></template>
<template id="pickup-template"><!--PICKUP--></template>
<template id="roster-template"><!--ROSTER--></template>
<template id="reply-template"><!--REPLY--></template>

</script></body></html>
