<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>Zengin作成後の修正・確認用モック</title>
<script src="tailwind.js"></script><link rel="stylesheet" href="preview.css">
</head><body class="bg-slate-50 text-slate-800">
<header class="preview-bar">
  <div><strong>確認用モック｜Zengin作成後の修正</strong><span>架空データのみ・実際の請求は変更しません</span></div>
  <label>試す状態 <select id="scenario"><option value="created">作成済み・銀行未提出</option><option value="empty">修正中・未入力</option><option value="partial">修正中・一部入力</option><option value="filled">修正中・入力済み</option><option value="error">修正中・入力エラー</option><option value="submitted">銀行提出済み</option><option value="result_imported">結果取込済み</option></select></label>
  <button id="reset" class="plain-button">最初から試す</button>
</header>
<div class="shell"><aside class="sidebar"><strong>open-hoikuict</strong><small>確認用・架空の見本園</small><p>ホーム</p><p>園児一覧</p><p>延長保育料金</p><button id="nav-index" class="selected">請求入力</button></aside>
<main><div id="notice" role="status" hidden></div><div id="view"></div></main></div>
<dialog id="reopen-dialog" aria-labelledby="dialog-title">
  <form id="reopen-form" method="dialog" novalidate>
    <h2 id="dialog-title">Zengin出力を取消して、請求を修正</h2>
    <p id="export-summary"></p>
    <p>この出力を「取消済み」にし、<strong>同じ請求月の入力画面</strong>へ戻します。請求金額は保持され、修正後に「保存」してからZenginを作り直します。</p>
    <div class="warning">ダウンロード済みの古いファイルは提出に使わないでください。この操作で銀行側の受付は取り消せません。</div>
    <label class="block-label">取消理由（必須）<textarea id="reason" rows="3" placeholder="例：写真代を訂正するため"></textarea></label>
    <label class="check-label"><input type="checkbox" id="unsubmitted">このファイルを銀行へ提出・アップロードしていないことを確認しました</label>
    <p id="dialog-error" role="alert" class="error" hidden></p>
    <div class="actions"><button type="button" id="close-dialog" class="plain-button">戻る</button><button type="submit" class="primary-button">取消して修正へ進む</button></div>
  </form>
</dialog>
<script src="views.js"></script><script src="preview.js"></script></body></html>
