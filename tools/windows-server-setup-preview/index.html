<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>オープン保育ICT — Windows導入アプリ 操作モック</title>
  <link rel="stylesheet" href="base.css"><link rel="stylesheet" href="preview.css">
  <script src="wizard.js" defer></script>
</head>
<body>
  <div class="review-tools" aria-label="モックの試用設定">
    <div><strong>操作確認用モック</strong><span>架空のデータです。PC設定の変更・メール送信・外部公開は行いません。<br>本物のパスワードや接続用トークンは入力しないでください。</span></div>
    <div class="review-selects">
      <label for="fixture">試す状態<select id="fixture">
        <option value="filled">新規・入力済みの例</option><option value="empty">新規・未入力</option><option value="partial">新規・一部入力</option>
        <option value="local">このPCへの導入済み</option><option value="lan">園内LANで利用中</option><option value="public">園外からも利用中</option>
      </select></label>
      <label for="fault">試すエラー<select id="fault">
        <option value="none">エラーなし</option><option value="download">ダウンロード失敗</option><option value="port">ポート使用中</option>
        <option value="dns">URL・証明書の確認失敗</option><option value="mail">メール接続失敗</option><option value="backup">バックアップ先に保存不可</option>
        <option value="admin">Windowsの管理者許可なし</option><option value="lan">LAN構築の途中で失敗</option><option value="tunnel">園外接続の設定失敗</option>
      </select></label>
    </div>
  </div>
  <header class="brand"><span class="brand-mark" aria-hidden="true">育</span><div>オープン保育ICT<small>Windows かんたん導入</small></div><span class="beta-tag">提案・動作は模擬</span></header>
  <main class="layout">
    <aside class="guide"><p class="eyebrow">使う範囲を、ひとつずつ。</p><h1>このPCから、<br>園内、そして園外へ。</h1><p id="guide-text">同じアプリで、導入から<br>接続の管理まで進めます。</p><ol id="steps" aria-label="導入の手順"></ol><div class="guide-note">設定に進んでも、確認画面で実行するまでは利用範囲を変更しません。</div></aside>
    <section class="card" id="wizard" aria-label="導入ウィザード"></section>
  </main>
  <footer class="page-footer">これは画面の確認用です。入力と処理結果は、このページを開いている間だけ保持します。<br>版番号・IPアドレス・確認結果は例です。ページを閉じると初期状態に戻ります。</footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="buttons"><button class="secondary" id="dialog-back" type="button">戻る</button><button class="primary" id="dialog-confirm" type="button"></button></div></dialog>
</body>
</html>
