<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>現行月案画面・架空データ</title><link rel="stylesheet" href="baseline.css"><link rel="stylesheet" href="style.css"></head>
<body><aside class="review-bar">確認用・架空データ <a href="index.html">変更案に戻る</a> <span>現行の入力項目と並び順。業務リンク・保存は無効。</span></aside>
<header class="app-header"><strong>open-hoikuict</strong><span>指導計画 / 現行の月案文例選択</span></header>
<main class="plan-docs-content baseline">
  <section class="form-header">
    <div>
      <p class="eyebrow">文例選択</p>
      <h1>月案を文例から作成</h1>
      <p class="lead">10件の文例から候補を表示しています。選択後に修正できます。</p>
    </div>
    <div class="toolbar-actions">
      <a class="button button--secondary" href="/plans/bunrei/facility/new">自作文例を追加</a>
    </div>
  </section>

  <form class="form-layout compact" method="get" action="#">
    <section class="form-panel">
      <h2>候補の条件</h2>
      <div class="field-grid">
        <label>
          <span>年齢</span>
          <select name="age_class">
            
              <option value="0歳児" >0歳児</option>
            
              <option value="1歳児" >1歳児</option>
            
              <option value="2歳児" >2歳児</option>
            
              <option value="3歳児" selected>3歳児</option>
            
              <option value="4歳児" >4歳児</option>
            
              <option value="5歳児" >5歳児</option>
            
          </select>
        </label>
        <label>
          <span>月</span>
          <select name="month">
            
              <option value="4" >4月</option>
            
              <option value="5" >5月</option>
            
              <option value="6" >6月</option>
            
              <option value="7" >7月</option>
            
              <option value="8" >8月</option>
            
              <option value="9" >9月</option>
            
              <option value="10" selected>10月</option>
            
              <option value="11" >11月</option>
            
              <option value="12" >12月</option>
            
              <option value="1" >1月</option>
            
              <option value="2" >2月</option>
            
              <option value="3" >3月</option>
            
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button class="button button--secondary" type="submit">候補を表示</button>
      </div>
    </section>
  </form>

  <form class="form-layout" method="post" action="#">
    <input type="hidden" name="age_class" value="3歳児">
    <input type="hidden" name="month" value="10">
    <section class="form-panel">
      <h2>基本情報</h2>
      <div class="field-grid">
        <label>
          <span>対象月</span>
          <input name="target_month" type="month" value="2026-10">
        </label>
        <label>
          <span>クラス</span>
          <select name="classroom_ref">
            
            <option value="そら組（架空）" selected>そら組（架空）</option>
            
            <option value="にじ組（架空）" >にじ組（架空）</option>
            
          </select>
        </label>
        <label>
          <span>作成者</span>
          <input name="owner_name" type="text" value="担任（架空）">
        </label>
      </div>
    </section>

    <section class="form-panel">
  <h2>文例候補</h2>
  <div class="bunrei-groups">
    
      <section class="bunrei-group">
        <h3>今月のねらい</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_goal" value="sample-0">
                <span>
                  <strong>架空の園文例 / 教育のねらい</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>子どもの姿の捉え</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_children_snapshot" value="sample-1">
                <span>
                  <strong>架空の園文例 / 前月末の子どもの姿</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>環境構成</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_environment" value="sample-2">
                <span>
                  <strong>架空の園文例 / 環境構成・保育者の援助</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>援助</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_support" value="sample-3">
                <span>
                  <strong>架空の園文例 / 活動内容</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>健康・安全への配慮</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_health_safety" value="sample-4">
                <span>
                  <strong>架空の園文例 / 健康・安全への配慮</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>食育</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_food_education" value="sample-5">
                <span>
                  <strong>架空の園文例 / 食育</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>行事</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_events" value="sample-6">
                <span>
                  <strong>架空の園文例 / 行事</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>10の姿</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_10_perspectives" value="sample-7">
                <span>
                  <strong>架空の園文例 / 10の姿のねらい</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>家庭連携</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_family_collaboration" value="sample-8">
                <span>
                  <strong>架空の園文例 / 家庭との連携</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
      <section class="bunrei-group">
        <h3>月末の振り返り観点</h3>
        
          <div class="bunrei-options">
            
              <label class="bunrei-option">
                <input type="checkbox" name="section_monthly_reflection_viewpoint" value="sample-9">
                <span>
                  <strong>架空の園文例 / 評価・反省</strong>
                  <em>これは現行画面の項目と長さを確認する架空の文例です。</em>
                  
                </span>
              </label>
            
          </div>
        
      </section>
    
  </div>
</section>


    <div class="form-actions">
      <a class="button button--ghost" href="/plans/">戻る</a>
      <button class="button button--primary" type="submit">選んだ文例で作成して修正へ</button>
    </div>
  </form>
</main><script src="baseline.js"></script></body></html>
