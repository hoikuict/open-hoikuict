function remember(snapshot=state){history.push(clone(snapshot));if(history.length>15)history.shift();}
function persist(){const data={modelContent:{ageClass:state.age,scope:individual()?'individual':'group',target:target(state.key),field:label(state.key),keyword:state.keyword,template:templates[Math.min(3,state.age)][0]},privateContent:{draft:clone(state)}};if(new TextEncoder().encode(JSON.stringify(data)).length<15800){sentSnapshots.add(JSON.stringify(state));if(sentSnapshots.size>30)sentSnapshots.delete(sentSnapshots.values().next().value);window.openai?.setWidgetState?.(data).catch(()=>{});}else announce('この見本の保存容量を超えました。現在の画面には文章を保持しています。');}
function status(){const n=Object.values(draft().fields).filter(x=>x.body?.trim()).length;q('#count').textContent=n?n+'欄に入力済み':'本文は空白です';q('#undo').disabled=!history.length;q('#save-state').textContent=saved&&JSON.stringify(saved)===JSON.stringify(state.drafts)?'この画面で保存済み':'未保存';q('#revert').hidden=!saved;}
function cell(k,l=label(k)){return `<textarea rows="1" class="cell" data-cell="${esc(k)}" aria-label="${esc(target(k)+' / '+l)}" data-active="${k===state.key}" spellcheck="false">${esc(value(k))}</textarea>`;}
function autosize(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight,parseFloat(getComputedStyle(el).minHeight)||0)+'px';}
function selectedCell(){return all('[data-cell]').find(el=>el.dataset.cell===state.key);}
function highlight(){all('[data-cell]').forEach(el=>el.dataset.active=String(el.dataset.cell===state.key));all('[data-child]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.child)===state.child)));}
function commitEdit(){if(before&&JSON.stringify(before.drafts)!==JSON.stringify(state.drafts))remember(before);before=null;clearTimeout(persistTimer);persist();status();}
function common(keys){return `<table class="common" aria-label="クラス共通欄"><thead><tr>${keys.map(k=>'<th scope="col">'+label(k)+'</th>').join('')}</tr></thead><tbody><tr>${keys.map(k=>`<td data-label="${label(k)}">${cell(k)}</td>`).join('')}</tr></tbody></table>`;}
const meta=(k,l)=>`<input class="meta" data-meta="${k}" aria-label="${l}" placeholder="${l}" maxlength="30" value="${esc(draft()[k])}">`;
function head(){const chief=state.age===1;return `<table class="head" aria-label="乳児指導計画の基本情報"><colgroup><col style="width:29%"><col style="width:12%"><col style="width:${chief?20:27}%"><col style="width:9%">${chief?'<col style="width:8%">':''}<col></colgroup><tbody><tr><td rowspan="2" class="title"><small>令和8年度 《10月》</small>乳児指導計画</td><th>クラス</th><th>担任</th><th>園長印</th>${chief?'<th>主任</th>':''}<th>行事</th></tr><tr><td>${meta('classroom','クラス名')}</td><td>${meta('author','担任名')}</td><td></td>${chief?'<td></td>':''}<td>${cell('common:events')}</td></tr></tbody></table>`;}
function personalTableHead(first){return `<colgroup><col style="width:12%"><col style="width:23%"><col style="width:21%"><col style="width:22%"><col style="width:22%"></colgroup><thead><tr><th rowspan="2">${first}</th><th colspan="2">個人別保育計画</th><th rowspan="2">環境構成・<br>援助活動</th><th rowspan="2">評価・反省</th></tr><tr><th>生活・健康<small>食事・睡眠・排泄・清潔</small></th><th>あそび<small>あそび・ことば</small></th></tr></thead>`;}
function roster(){const offset=pages[state.age].slice(0,state.page).reduce((a,b)=>a+b,0);return `<table class="roster" aria-label="個人別保育計画">${personalTableHead('名前')}<tbody>${Array.from({length:pages[state.age][state.page]},(_,j)=>{const i=j+offset;return `<tr data-child-row="${i}"><th scope="row" class="name"><button data-child="${i}" aria-pressed="${state.child===i}">園児${String.fromCharCode(65+i)}<small>見本</small><small>（歳 ヶ月）</small></button></th>${personal.map(([k,l])=>`<td data-label="${l}">${cell('child:'+i+':'+k,l)}</td>`).join('')}</tr>`;}).join('')}</tbody></table>`;}
function renderPastPlans(){
 const visible=individual()&&state.showHistory,button=q('#history-toggle'),section=q('#past-plans');
 root.dataset.history=String(visible);button.hidden=!individual();button.setAttribute('aria-expanded',String(visible));button.textContent=visible?'過去3か月を閉じる':'過去3か月を表示';
 q('#page-wrap').hidden=!individual()||visible||pages[state.age].length===1;
 all('[data-child-row]').forEach(row=>row.hidden=visible&&Number(row.dataset.childRow)!==state.child);
 if(!section)return;section.hidden=!visible;q('#current-month').hidden=!visible;if(!visible)return;
 q('#current-month').textContent='10月の入力 · '+childName(state.child);
 const field=isChild(state.key)?state.key.split(':')[2]:'',signature=[state.age,state.child].join(':');
 if(section.dataset.signature!==signature){
  section.dataset.signature=signature;const records=pastRecords[state.age]?.[state.child]||[];
  section.innerHTML=`<div class="past-heading"><h3 id="past-title">${esc(childName(state.child))} · 過去3か月</h3><small>2026年7〜9月 · 閲覧用・架空の履歴見本</small></div><table class="past-table" aria-label="過去3か月の個人計画と反省">${personalTableHead('月')}<tbody>${[7,8,9].map((month,index)=>{const record=records[index];return `<tr class="past-month"><th scope="row">${month}月</th>${record?personal.map(([key],i)=>`<td data-past-field="${key}"><p class="past-body">${esc(record[i])}</p></td>`).join(''):'<td colspan="4"><p class="past-empty">この月の記録はありません</p></td>'}</tr>`;}).join('')}</tbody></table>`;
 }
 all('[data-past-field]').forEach(el=>el.dataset.active=String(el.dataset.pastField===field));
}
function group(){return `<div class="group-layout"><div class="group-main"><table class="head" aria-label="幼児月指導計画の基本情報"><tbody><tr><td rowspan="2" class="title" style="width:40%"><small>令和8年度 10月</small>月 指導計画</td><th>クラス</th><th>担任名</th><th style="width:10%">園長印</th><th style="width:8%">主任</th></tr><tr><td>${meta('classroom','クラス名')}</td><td>${meta('author','担任名')}</td><td></td><td></td></tr></tbody></table>${common(['common:goal','common:home'])}<table class="group-grid" aria-label="集団の養護・教育・食育"><colgroup><col style="width:5%"><col style="width:9%">${cols.map(()=>'<col style="width:21.5%">').join('')}</colgroup><thead><tr><th colspan="2"></th>${cols.map(x=>'<th scope="col">'+x[1]+'</th>').join('')}</tr></thead><tbody>${domains.map(([d,l],i)=>`<tr>${i===0?'<th>養護</th>':i===1?'<th rowspan="5">教育</th>':''}<th ${i===6?'colspan="2"':''} scope="row">${l}</th>${d==='food'?'<td colspan="4">'+cell('group:food','食育')+'</td>':cols.map(([c,t])=>'<td>'+cell('group:'+d+':'+c,l+' / '+t)+'</td>').join('')}</tr>`).join('')}</tbody></table>${common(['common:review'])}</div><table class="calendar" aria-label="10月の行事・活動"><colgroup><col style="width:20px"><col style="width:20px"><col></colgroup><thead><tr><th>日</th><th>曜日</th><th>行事・活動</th></tr></thead><tbody>${Array.from({length:31},(_,i)=>{const d=i+1,w=new Date(2026,9,d).getDay();return `<tr><td class="${w===0||w===6?'weekend':''}">${d}</td><td>${'日月火水木金土'[w]}</td><td>${cell('event:'+d,d+'日 行事・活動')}</td></tr>`;}).join('')}</tbody></table></div>`;}
function paper(){q('#form').innerHTML=individual()?head()+common(['common:goal','common:home','common:review'])+'<section id="past-plans" class="past-plans" aria-labelledby="past-title" hidden></section><div id="current-month" class="current-month" hidden></div>'+roster():group();const t=templates[Math.min(3,state.age)];q('#template').textContent='様式：'+t[0];q('#template').href='https://docs.google.com/spreadsheets/d/'+t[1]+'/edit';all('button,select,summary').forEach(e=>e.classList.add('cursor-interaction'));all('textarea.cell').forEach(autosize);status();}
function pickers(){q('#age').value=String(state.age);q('#scope').textContent=individual()?'個人別の様式':'集団の様式';q('#child-wrap').hidden=!individual();q('#page-wrap').hidden=!individual()||pages[state.age].length===1;if(individual()){const n=pages[state.age].reduce((a,b)=>a+b,0);q('#child').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i}">${childName(i)}</option>`).join('');q('#child').value=String(state.child);q('#page').innerHTML=pages[state.age].map((n,i)=>`<option value="${i}">${i+1} / ${pages[state.age].length}ページ</option>`).join('');q('#page').value=String(state.page);}}
const life=['一人ひとりの眠くなる時間に合わせ、安心できる場所で休息をとる。','食具を使って自分で食べようとする気持ちを受け止める。','衣服の着脱や手洗いを自分でやってみようとする。'],play=['保育者と目を合わせ、声や身近な玩具の動きを楽しむ。','保育者と一緒に秋の葉に触れ、感触や音を楽しむ。','見つけた木の実や葉を使って見立て遊びを楽しむ。'];
function samples(){const k=state.key,a=state.age,f=k.split(':').at(-1),d=k.split(':')[1];if(f==='review')return ['取り組みを振り返り、子どもの姿と次月に引き継ぐ配慮を記録する。','できたことや難しかった場面を具体的に記録し、次の援助を検討する。'];if(k==='common:home')return ['家庭での生活リズムや体調を伝え合い、日々の保育に生かす。','衣服の調節や休息について家庭と共有し、季節の変わり目を心地よく過ごせるようにする。'];if(k.startsWith('event:')||f==='events')return ['秋の自然に親しむ散歩','身近な自然を見つける散歩'];if(k==='common:goal')return a<=2?[play[a],'一人ひとりの興味を受け止め、安心できる保育者とのやりとりを楽しむ。']:['友だちと一緒に体を動かし、秋の自然に親しむ。','秋の自然に触れながら、友だちと発見やイメージを共有して遊ぶ。'];if(f==='life')return [life[a],'一人ひとりのペースを大切にし、'+life[a]];if(f==='play')return [play[a],'好きな遊びを繰り返し楽しめるようにし、'+play[a]];if(f==='help')return ['興味のある素材を手の届く場所に用意し、表情やしぐさに合わせて関わる。','安心できる保育者がそばで見守り、子どもの働きかけにゆったりと応える。'];const theme={care:['安心して思いを表し、心地よく過ごす。','落ち着いて過ごせる場所を整え、気持ちを受け止める。'],health:['戸外で十分に体を動かして遊ぶ。','安全に体を動かせる広さと道具を用意する。'],relations:['友だちと思いを伝え合って遊ぶ。','少人数で関わり合える遊びの場を設ける。'],nature:['身近な秋の自然の変化に気づく。','木の実や葉を観察し、比べられる場所を用意する。'],language:['経験したことを自分の言葉で伝える。','ゆっくり話せる時間を設け、絵本や言葉のやりとりを楽しむ。'],expression:['感じたことを動きや造形で表す。','さまざまな素材や音に触れられる環境を整える。'],food:['食材に興味をもち、楽しく食事をする。','秋の食材を見たり触れたりする機会をつくる。']}[d];if(f==='goal')return [theme[0],theme[0]+'一人ひとりの興味を友だちとの遊びへつなげる。'];if(f==='environment')return [theme[1],theme[1]+'自分で選べる配置を工夫する。'];if(f==='expected')return ['興味をもったことを繰り返し試し、友だちに伝えようとする。','気になることを自分なりに試し、友だちのやり方にも関心を向ける。'];return ['一人ひとりの思いを受け止め、必要に応じて言葉を添える。','試す過程を大切にして見守り、困ったときに一緒に考える。'];}
function candidateRows(){const s=state.key==='group:food'?['食材に興味をもち、楽しく食事をする。','秋の食材を見たり触れたりする機会をつくる。']:samples();return s.map((t,i)=>({text:state.mode==='ai'?s[1-i]:t,reference:t}));}
function candidateMarks(){const rows=candidateRows();all('[data-candidate]').forEach(b=>{const added=value(state.key).includes(rows[Number(b.dataset.candidate)].text);b.classList.toggle('is-added',added);b.setAttribute('aria-disabled',String(added));b.querySelector('.used').hidden=!added;});}
function candidates(){const rows=candidateRows(),words=String(state.keyword||'').normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean),filtered=rows.map((row,index)=>({row,index})).filter(({row})=>words.every(word=>row.text.normalize('NFKC').toLowerCase().includes(word)));q('#candidates').innerHTML=filtered.map(({row:r,index:i})=>`<button type="button" class="candidate cursor-interaction" data-candidate="${i}" aria-label="${esc(r.text)}">${esc(r.text)}<span class="used" hidden>✓ 反映済み</span></button>`).join('')||'<p class="no-results">該当する候補がありません。キーワードを変えてください。</p>';q('#candidate-count').textContent=filtered.length+' / '+rows.length+'件';q('#candidate-source-list').innerHTML=`<p>${state.age}歳児・10月 / ${esc(label(state.key))}<br>操作確認用の架空資料。Driveの実際の記録ではありません。</p>`+filtered.map(({row:r,index:i})=>`<p>${i+1}. ${state.mode==='ai'?'提案の参考原文':'原文見本'}<br>${esc(r.reference)}</p>`).join('');all('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));candidateMarks();}
function origins(){const used=draft().fields[state.key]?.origins||[];q('#origins').hidden=!used.length;q('#origin-list').innerHTML=used.map(o=>`<p>${esc(o.type==='ai'?'AI提案見本・参考原文':'原文見本')}<br>${esc(o.label)}<br>${esc(o.text)}</p>`).join('');}
function panel(){q('#target').textContent=target(state.key);q('#field-label').textContent=label(state.key);q('#keyword').value=state.keyword;origins();candidates();renderPastPlans();status();}
function render(){root.dataset.wide=String(state.wide);pickers();paper();panel();}
function pageFor(i){let n=0;for(let p=0;p<pages[state.age].length;p++){n+=pages[state.age][p];if(i<n)return p;}return 0;}
function select(k){commitEdit();state.key=k;if(isChild(k)){state.child=Number(k.split(':')[1]);state.page=pageFor(state.child);}render();persist();selectedCell()?.focus({preventScroll:true});announce(target(k)+' / '+label(k)+' を選択');}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b){if(e.target.tagName==='TD')e.target.querySelector('textarea')?.focus();return;}
 if(b.id==='history-toggle'){commitEdit();state.showHistory=!state.showHistory;renderPastPlans();all('textarea.cell').forEach(autosize);persist();announce(state.showHistory?'過去3か月の計画と反省を表示しました。下の10月のセルで入力できます。':'過去の表示を閉じ、園児一覧に戻しました。');return;}
 if(b.dataset.child!==undefined){select('child:'+b.dataset.child+':life');return;}
 if(b.dataset.mode){state.mode=b.dataset.mode;candidates();persist();return;}
 if(b.dataset.candidate!==undefined){commitEdit();const row=candidateRows()[Number(b.dataset.candidate)],old=draft().fields[state.key]||{body:'',origins:[]};if(old.body.includes(row.text)){announce('この文例は反映済みです。編集・削除はセル内でできます。');return;}remember();const origin={type:state.mode,label:state.age+'歳児・10月 / '+label(state.key)+'（架空資料）',text:row.reference};const body=old.body.trim()?old.body.replace(/\s+$/,'')+'\n○'+row.text:'○'+row.text;draft().fields[state.key]={body,origins:[...(old.origins||[]).filter(o=>JSON.stringify(o)!==JSON.stringify(origin)),origin]};const ta=selectedCell();ta.value=body;autosize(ta);origins();candidateMarks();status();persist();ta.focus({preventScroll:true});ta.setSelectionRange(body.length,body.length);announce('セルに反映しました。そのまま入力・Backspaceで編集できます。');return;}
 if(b.id==='undo'&&history.length){commitEdit();state=history.pop();render();persist();announce('直前の変更を戻しました。');return;}
 if(b.id==='save'){commitEdit();saved=clone(state.drafts);status();persist();announce('下書きをこの画面内に保存しました（見本）。');return;}
 if(b.id==='revert'&&saved){commitEdit();remember();state.drafts=clone(saved);render();persist();announce('この画面で保存した内容に戻しました。');}
});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='age'){commitEdit();state.age=Number(t.value);state.child=0;state.page=0;state.key=individual()?'child:0:life':'common:goal';render();persist();announce(state.age+'歳児・'+(individual()?'個人別':'集団')+'の様式に切り替えました。');}else if(t.id==='child')select('child:'+t.value+':'+(isChild(state.key)?state.key.split(':')[2]:'life'));else if(t.id==='page'){state.page=Number(t.value);select('child:'+pages[state.age].slice(0,state.page).reduce((a,b)=>a+b,0)+':life');}});
root.addEventListener('focusin',e=>{const t=e.target;if(t.dataset.cell){state.key=t.dataset.cell;if(isChild(state.key)){state.child=Number(state.key.split(':')[1]);q('#child').value=String(state.child);}highlight();panel();before=clone(state);persist();}else if(t.dataset.meta)before=clone(state);});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='keyword'){state.keyword=t.value;candidates();}else if(t.dataset.cell){const k=t.dataset.cell,old=draft().fields[k]||{origins:[]};if(t.value)draft().fields[k]={...old,body:t.value};else delete draft().fields[k];autosize(t);candidateMarks();origins();status();}else if(t.dataset.meta){draft()[t.dataset.meta]=t.value;status();}else return;clearTimeout(persistTimer);persistTimer=setTimeout(persist,200);});
root.addEventListener('focusout',e=>{if(e.target.matches('textarea,input'))commitEdit();});
window.addEventListener('openai:set_globals',e=>{const raw=e.detail?.globals?.widgetState?.privateContent?.draft;if(![3,4,5].includes(raw?.version))return;const incoming=normalize(raw),signature=JSON.stringify(incoming);if(signature===JSON.stringify(state)||sentSnapshots.has(signature))return;state=incoming;history=[];before=null;render();});
render();let paperWidth=0;const resize=new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width!==paperWidth){paperWidth=width;all('textarea.cell').forEach(autosize);}});resize.observe(q('.paper'));
if(globalThis.Tweak){const design={widePaper:state.wide};const tweak=new Tweak({container:root,onChange:()=>{state.wide=design.widePaper;root.dataset.wide=String(state.wide);persist();}});tweak.addToggle(design,'widePaper',{label:'帳票を広く表示し、候補を下に置く'});}
})();
</script>
