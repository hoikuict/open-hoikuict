<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>行事反省・経緯レコードの作成｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "institutional-new", "kind": "institutional", "title": "\u884c\u4e8b\u53cd\u7701\u30fb\u7d4c\u7def\u30ec\u30b3\u30fc\u30c9\u306e\u4f5c\u6210"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 行事反省・経緯レコードの作成</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">入力項目と必須条件は現行版を基準にしています。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="mock-normal">
<div class="mx-auto max-w-4xl space-y-5">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">経緯レコードを作成</h1>
      <p class="mt-1 text-sm text-slate-500">個人を特定できる園児・家庭・健康情報は本文へ転記しないでください。</p>
    </div>
    <a href="#" class="text-sm text-indigo-600 hover:underline" data-original-href="/records/">戻る</a>
  </div>

  <form method="post" action="#" class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm" data-original-action="/records/" novalidate="">
    
    <div>
      <label class="mb-1 block text-sm font-semibold text-slate-700">タイトル <span class="text-red-600">必須</span></label>
      <input type="text" name="title" required maxlength="200" value="" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>

    <div class="grid gap-5 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">由来 <span class="text-red-600">必須</span></label>
        <select name="origin" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
          <option value="" selected disabled>明示的に選択してください</option>
          
          <option value="safety_incident">安全（事故・ヒヤリハット）</option>
          
          <option value="administrative">行政・監査</option>
          
          <option value="retrospective">行事反省</option>
          
          <option value="operational">運用改善</option>
          
          <option value="other">その他</option>
          
        </select>
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">対象年度</label>
        <input type="number" name="fiscal_year" min="1900" max="2100" value="" class="w-full rounded-lg border border-slate-300 px-3 py-2">
        <p class="mt-1 text-xs text-slate-500">「行事反省」を選ぶ場合は必須です。</p>
      </div>
    </div>

    <div>
      <label class="mb-1 block text-sm font-semibold text-slate-700">きっかけ・背景 <span class="text-red-600">必須</span></label>
      <textarea name="background" rows="7" required maxlength="10000" class="w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
      <p class="mt-1 text-xs text-slate-500">いつ、何が起きたかを個人が特定されない形で記録します。</p>
    </div>

    <div>
      <label class="mb-1 block text-sm font-semibold text-slate-700">何を防ぐ・実現するためか <span class="text-red-600">必須</span></label>
      <textarea name="purpose" rows="4" required maxlength="4000" class="w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
    </div>

    <div>
      <label class="mb-1 block text-sm font-semibold text-slate-700">見直してよくなる条件</label>
      <textarea name="revisit_condition" rows="3" maxlength="4000" class="w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
    </div>

    <div class="grid gap-5 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">出来事の発生日</label>
        <input type="date" name="occurred_on" value="" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">次回確認日</label>
        <input type="date" name="review_due_on" value="" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
    </div>

    
    <fieldset class="space-y-4 rounded-xl border border-slate-200 bg-slate-50 p-4">
      <legend class="px-2 text-sm font-semibold text-slate-700">公開範囲と最初のリンク</legend>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">本文の公開範囲</label>
        <select name="visibility" class="w-full rounded-lg border border-slate-300 px-3 py-2">
          
          <option value="staff" selected>全職員</option>
          
          <option value="linked_targets">リンク先を閲覧できる職員</option>
          
        </select>
        <p class="mt-1 text-xs text-slate-500">限定公開を選ぶ場合は、下でリンク先を1件指定してください。</p>
      </div>
      <label class="flex items-center gap-2 text-sm font-semibold text-slate-700">
        <input type="checkbox" name="include_initial_link" value="yes" class="h-4 w-4 rounded border-slate-300 text-indigo-600">
        作成時にリンク先を指定する
      </label>
      <div class="grid gap-4 md:grid-cols-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">リンク種別</label>
          <select name="initial_target_type" autocomplete="off" class="w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="" selected>選択してください</option>
            
            <option value="survey">アンケート</option>
            
            <option value="notice">お知らせ</option>
            
            <option value="meeting_note">議事録</option>
            
            <option value="event">カレンダー予定</option>
            
            <option value="external">外部資料</option>
            
          </select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">対象ID</label>
          <input type="text" name="initial_target_id" autocomplete="off" value="" class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="外部資料では空欄">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">外部資料名</label>
          <input type="text" name="initial_target_label" autocomplete="off" class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="紙の園規程など">
        </div>
      </div>
    </fieldset>
    

    <div class="flex gap-3">
      <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700">経緯レコードを作成</button>
      <a href="#" class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-50" data-original-href="/records/">キャンセル</a>
    </div>
  </form>
</div>
</main>
<dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
