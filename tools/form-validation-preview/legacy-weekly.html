<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>旧式の週案（旧POSTの再表示）｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "legacy-weekly", "kind": "generic", "title": "\u65e7\u5f0f\u306e\u9031\u6848\uff08\u65e7POST\u306e\u518d\u8868\u793a\uff09"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 旧式の週案（旧POSTの再表示）</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">通常の新規作成は現在の週案へ移動します。旧式POSTで入力エラーとなった場合の再表示を確認する画面です。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="plan-docs-content">
  <section class="form-header">
    <div>
      <p class="eyebrow">weekly_plan</p>
      <h1>週案を作成</h1>
      <p class="lead">月案、前週の振り返り、今の子どもの姿をつなぎ、1週間の見通しを作成します。</p>
    </div>
  </section>

  

  <form class="form-layout" method="post" action="#" data-original-action="/plans/weekly-plans" novalidate="">
    <section class="form-panel">
      <h2>基本情報</h2>
      <div class="field-grid">
        <label>
          <span>対象週</span>
          <input name="target_week" type="week" required value="">
        </label>
        <label>
          <span>クラス</span>
          
          <select name="classroom_ref">
            
            <option value="ひよこ組" selected>ひよこ組</option>
            
            <option value="うさぎ組">うさぎ組</option>
            
          </select>
        </label>
        <label>
          <span>年齢</span>
          <select name="age_class" required>
            <option value="">選択してください</option>
            
              <option value="0歳児">0歳児</option>
            
              <option value="1歳児">1歳児</option>
            
              <option value="2歳児">2歳児</option>
            
              <option value="3歳児">3歳児</option>
            
              <option value="4歳児">4歳児</option>
            
              <option value="5歳児">5歳児</option>
            
          </select>
        </label>
        <label>
          <span>作成者</span>
          <input name="owner_name" type="text" value="">
        </label>
      </div>
      <label class="check-row">
        <input name="include_saturday" type="checkbox" value="on">
        <span>土曜を含める</span>
      </label>
    </section>

    <section class="form-panel">
      <h2>月案との接続</h2>
      
      <label>
        <span>接続する月案</span>
        <select name="parent_document_id">
          <option value="">接続しない</option>
          
        </select>
      </label>
      <label>
        <span>月案から今週へつなぐ文脈</span>
        <textarea name="related_monthly_summary" rows="4" placeholder="月案のねらい、子どもの姿、環境や援助のうち今週に効くことを短く記入"></textarea>
      </label>
    </section>

    <section class="form-panel">
      <h2>今週の入力</h2>
      <label>
        <span>前週の振り返り</span>
        <textarea name="previous_week_reflection" rows="4" placeholder="子どもが深めたこと、環境が働いた場面、次へ残したい問い"></textarea>
      </label>
      <label>
        <span>現在の子どもの姿</span>
        <textarea name="current_children_snapshot" rows="4" placeholder="具体的な場面、友だちとの関わり、興味や戸惑い"></textarea>
      </label>
      <label>
        <span>今週の主な活動・経験</span>
        <textarea name="weekly_activities_note" rows="4" placeholder="決め切りすぎず、子どもの姿から広がりそうな経験を書く"></textarea>
      </label>
      <div class="field-grid">
        <label>
          <span>季節・行事・生活の流れ</span>
          <textarea name="seasonal_context" rows="3"></textarea>
        </label>
        <label>
          <span>家庭からの情報</span>
          <textarea name="family_context" rows="3"></textarea>
        </label>
        <label>
          <span>担任間で共有したい配慮</span>
          <textarea name="class_notes" rows="3"></textarea>
        </label>
      </div>
    </section>

    <div class="form-actions">
      <a class="button button--ghost" href="#" data-original-href="/plans/">戻る</a>
      <button class="button button--primary" type="submit">週案帳票を作成</button>
    </div>
  </form>
</main>
<dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
