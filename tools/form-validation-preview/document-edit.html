<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>保存済み帳票の修正｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "document-edit", "kind": "generic", "title": "\u4fdd\u5b58\u6e08\u307f\u5e33\u7968\u306e\u4fee\u6b63"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 保存済み帳票の修正</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">入力項目と必須条件は現行版を基準にしています。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="plan-docs-content">
  <section class="form-header">
    <div>
      <p class="eyebrow">日案</p>
      <h1>帳票を修正</h1>
      <p class="lead">園: ひかり保育園 / クラス: ひよこ組 / 下書き</p>
      
    </div>
  </section>

  <form class="form-layout" method="post" action="#" data-original-action="/plans/documents/1" novalidate="">
    <input name="lock_version" type="hidden" value="1">
    <section class="form-panel">
      <h2>基本情報</h2>
      <div class="field-grid">
        <label>
          <span>タイトル</span>
          <input name="title" type="text" value="2026-11-16 日案（ひよこ組）">
        </label>
        <label>
          <span>作成者</span>
          <input name="owner_name" type="text" value="見本 はなこ">
        </label>
      </div>
      <label>
        <span>確認が必要な入力</span>
        <textarea name="confirmation_items" rows="3"></textarea>
      </label>
    </section>

    <section class="form-panel">
      <h2>セクション本文</h2>
      <div class="edit-section-list">
        
          
          <div class="edit-section">
            <div class="report-section__heading">
              <h3>ねらい</h3>
            </div>
            <label>
              <span>本文</span>
              <textarea name="body_daily_goal" rows="6">秋の自然に親しむ。</textarea>
            </label>
            <label>
              <span>編集メモ</span>
              <input name="editor_note_daily_goal" type="text" value="">
            </label>
            
          </div>
          
        
          
          <div class="edit-section">
            <div class="report-section__heading">
              <h3>内容（活動）</h3>
            </div>
            <label>
              <span>本文</span>
              <textarea name="body_daily_content" rows="6">架空の下書きです。</textarea>
            </label>
            <label>
              <span>編集メモ</span>
              <input name="editor_note_daily_content" type="text" value="">
            </label>
            
          </div>
          
        
      </div>
    </section>

    
      <section class="form-panel">
        <h2>1日の流れ</h2>
        
          <p class="field-note">4列の内容は保存済み下書きのコピーです。コーパスの原文には影響せず、各セルを自由に編集できます。</p>
          <div class="daily-plan-grid-scroll">
            <table class="daily-plan-edit-grid">
              <colgroup><col class="daily-plan-time-column"><col><col><col></colgroup>
              <thead>
                <tr>
                  <th>時間</th>
                  <th>子どもの様子</th><th>保育士の援助</th><th>配慮事項</th>
                </tr>
              </thead>
              <tbody>
                
                  <tr>
                    <td>
                      <label>
                        <span class="visually-hidden">時刻</span>
                        <input name="rowtime__row_1" type="text" value="10:00" placeholder="10:00〜10:45 / 随時">
                      </label>
                      <input name="rowlabel__row_1" type="hidden" value="">
                    </td>
                    
                      
                      <td>
                        <label>
                          <span class="visually-hidden">子どもの様子</span>
                          <textarea name="cell__row_1__children" rows="4">落ち葉を集めて遊ぶ見本です。</textarea>
                        </label>
                        
                      </td>
                    
                      
                      <td>
                        <label>
                          <span class="visually-hidden">保育士の援助</span>
                          <textarea name="cell__row_1__support" rows="4"></textarea>
                        </label>
                        
                      </td>
                    
                      
                      <td>
                        <label>
                          <span class="visually-hidden">配慮事項</span>
                          <textarea name="cell__row_1__considerations" rows="4"></textarea>
                        </label>
                        
                      </td>
                    
                  </tr>
                
              </tbody>
            </table>
          </div>
        
      </section>
    

    <div class="form-actions">
      <a class="button button--ghost" href="#" data-original-href="/plans/documents/1">戻る</a>
      <button class="button button--primary" type="submit">修正を保存</button>
    </div>
  </form>
</main>
<dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
