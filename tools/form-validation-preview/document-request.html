<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>文書の確認依頼｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "document-request", "kind": "document-request", "title": "\u6587\u66f8\u306e\u78ba\u8a8d\u4f9d\u983c"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 文書の確認依頼</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">入力項目と必須条件は現行版を基準にしています。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="mock-normal">
<div class="mx-auto max-w-4xl space-y-6">
<h1 class="text-2xl font-bold">文書の確認依頼</h1>
<p>作成した文書を添付するか本文を貼り付けて、管理者に確認を依頼できます。依頼は管理者ホームの承認待ちに表示されます。</p>
<details class="rounded-xl border bg-white p-5"><summary class="cursor-pointer text-lg font-bold">新しい確認依頼</summary>
<form method="post" enctype="multipart/form-data" class="mt-5 space-y-4" data-original-action="" action="#" novalidate="">
<label class="block">件名<input name="title" required maxlength="200" class="mt-1 block w-full rounded border p-3"></label>
<label class="block">確認してほしい内容<textarea name="body" rows="6" maxlength="20000" class="mt-1 block w-full rounded border p-3"></textarea></label>
<label class="block">文書を添付<input type="file" name="attachments" multiple accept=".pdf,.docx,.doc,.xlsx,.xls,.odt,.txt,.png,.jpg,.jpeg" class="mt-2 block"></label>
<p class="text-sm text-slate-500">1件10MB、合計20MB、5件まで。提出後の文書は変更できません。修正時は新しい依頼として提出してください。</p>
<button class="rounded bg-indigo-600 px-5 py-3 text-white">管理者に確認を依頼する</button></form></details>
<p>確認依頼はありません。</p>
</div>
</main>
<dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
