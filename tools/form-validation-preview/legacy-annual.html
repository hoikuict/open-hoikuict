<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>旧式の年案｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "legacy-annual", "kind": "generic", "title": "\u65e7\u5f0f\u306e\u5e74\u6848"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 旧式の年案</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">入力項目と必須条件は現行版を基準にしています。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="plan-docs-content">
  <section class="form-header">
    <div>
      <p class="eyebrow">annual_plan</p>
      <h1>年案を作成</h1>
      <a class="button button--primary" href="#" data-original-href="/plans/annual-library">自園の年案を引き継ぐ・開く</a>
      <p class="lead">年度全体のねらいと4期の見通しを、帳票セクションに分けて作成します。</p>
    </div>
  </section>

  <form class="form-layout" method="post" action="#" data-original-action="/plans/annual-plans" novalidate="">
    <section class="form-panel">
      <h2>基本情報</h2>
      <div class="field-grid">
        <label>
          <span>年度</span>
          <input name="school_year" type="number" min="2020" max="2100" value="2026">
        </label>
        <label>
          <span>クラス</span>
          <select name="classroom_ref">
            
            <option value="ひよこ組" selected>ひよこ組</option>
            
            <option value="うさぎ組">うさぎ組</option>
            
          </select>
        </label>
        <label>
          <span>作成者</span>
          <input name="owner_name" type="text" value="Test Staff">
        </label>
      </div>
    </section>

    <section class="form-panel">
      <h2>年間の軸</h2>
      <label>
        <span>クラスの姿</span>
        <textarea name="class_outlook" rows="4" placeholder="年度初めの子どもの姿、関係性、生活面の特徴"></textarea>
      </label>
      <label>
        <span>年間で大切にしたい育ち</span>
        <textarea name="focus_growth" rows="4" placeholder="主体性、協同性、言葉、身体、表現など"></textarea>
      </label>
      <div class="field-grid">
        <label>
          <span>主な行事</span>
          <textarea name="annual_events" rows="3"></textarea>
        </label>
        <label>
          <span>季節・地域の文脈</span>
          <textarea name="seasonal_context" rows="3"></textarea>
        </label>
      </div>
    </section>

    <section class="form-panel">
      <h2>配慮と連携</h2>
      <div class="field-grid">
        <label>
          <span>配慮事項</span>
          <textarea name="care_points" rows="4"></textarea>
        </label>
        <label>
          <span>家庭連携方針</span>
          <textarea name="family_collaboration_policy" rows="4"></textarea>
        </label>
        <label>
          <span>健康・安全</span>
          <textarea name="health_safety_policy" rows="4"></textarea>
        </label>
        <label>
          <span>好ましい表現</span>
          <textarea name="preferred_expressions" rows="4"></textarea>
        </label>
      </div>
    </section>

    <section class="form-panel">
      <h2>4期のメモ</h2>
      <div class="field-grid">
        <label>
          <span>4〜6月</span>
          <textarea name="term_1_note" rows="3"></textarea>
        </label>
        <label>
          <span>7〜9月</span>
          <textarea name="term_2_note" rows="3"></textarea>
        </label>
        <label>
          <span>10〜12月</span>
          <textarea name="term_3_note" rows="3"></textarea>
        </label>
        <label>
          <span>1〜3月</span>
          <textarea name="term_4_note" rows="3"></textarea>
        </label>
      </div>
    </section>

    <div class="form-actions">
      <a class="button button--ghost" href="#" data-original-href="/plans/">戻る</a>
      <button class="button button--primary" type="submit">年案帳票を作成</button>
    </div>
  </form>
</main>
<dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
