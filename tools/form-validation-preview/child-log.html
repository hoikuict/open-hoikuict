<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>子どもの記録の追加｜記入漏れ案内の確認</title><link rel="stylesheet" href="assets/base.css"><script src="assets/tailwind.js"></script>
<link rel="stylesheet" href="mock.css"><script id="mock-fixture" type="application/json">{"data": {}, "key": "child-log", "kind": "child-log", "title": "\u5b50\u3069\u3082\u306e\u8a18\u9332\u306e\u8ffd\u52a0"}</script><script src="mock.js"></script>
</head><body><aside class="mock-toolbar" aria-label="確認用の操作"><a href="index.html">← 対象一覧</a><strong>確認用モック · 子どもの記録の追加</strong><p>架空データです。保存・提出・通知はこの画面内の見本です。</p>
<div class="mock-controls"><label>試す状態<select id="mock-state"><option value="partial">一部入力</option><option value="empty">未入力</option><option value="filled">入力済み</option><option value="error">保存エラー</option></select></label><button type="button" id="mock-reset">見本に戻す</button><label>試す操作<select id="mock-operation"></select></label><button type="button" id="mock-jump">操作ボタンの位置へ</button></div><p id="mock-note">入力項目と必須条件は現行版を基準にしています。</p><p id="mock-status" role="status"></p></aside>
<main id="mock-business" class="mock-normal">
<div class="mx-auto max-w-4xl space-y-6">
  <div>
    <p class="text-sm font-semibold text-indigo-600">見本 はな</p>
    <h1 class="mt-1 text-2xl font-bold text-slate-900">子どもの記録を追加</h1>
    <p class="mt-2 text-sm text-slate-600">具体的に見えた姿を中心に、必要な範囲で関わりや振り返りを記録します。</p>
  </div>
  <div id="record-form-error" role="alert" hidden class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></div>

  <form data-record-form method="post" action="#" class="space-y-6" data-original-action="/children/1/records" novalidate="">
    
    <fieldset class="rounded-2xl border border-slate-200 bg-white p-5 space-y-3">
      <legend class="font-semibold">共有範囲</legend>
      <label class="mr-5 inline-flex gap-2"><input type="radio" name="visibility" value="private" checked>自分だけ</label>
      <label class="inline-flex gap-2"><input type="radio" name="visibility" value="shared">みんなで共有</label>
      
      <p class="text-sm text-slate-600">「自分だけ」は書いた本人だけが閲覧・訂正できます。管理者にも表示されません。</p>
      
      <fieldset data-restricted-recipients hidden class="rounded-lg border border-rose-200 p-3">
        <legend class="font-semibold text-rose-800">取扱注意の共有先</legend>
        <p class="text-sm mb-2">記録者と管理者、および選択した職員だけに共有します。</p>
        <div class="flex flex-wrap gap-3"></div>
      </fieldset>
      
    </fieldset>
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="grid gap-5 md:grid-cols-2">
        
          
          <label class="block text-sm font-medium text-slate-700">観察日・出来事の日 <span class="text-rose-600">*</span>
            <input type="date" name="observed_on" value="2026-11-15" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
            <span class="mt-1 block text-xs font-normal text-slate-500">実際に子どもの姿を見た日を記録します。</span>
          </label>
          
        
          
          <label class="block text-sm font-medium text-slate-700 md:col-span-2">子どもの姿 <span class="text-rose-600">*</span>
            <textarea name="child_state" rows="6" maxlength="5000" required class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="例：積み木を何度も積み直し、崩れると『もう一回』と言って隣の子と笑い合っていた。"></textarea>
            <span class="mt-1 block text-xs font-normal text-slate-500">解釈だけでなく、言葉や行動などの具体的な姿を記録します。</span>
          </label>
          
        
          
          <label class="block text-sm font-medium text-slate-700 md:col-span-1">保育者の関わり
            <textarea name="caregiver_support" rows="4" maxlength="5000" class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
            <span class="mt-1 block text-xs font-normal text-slate-500">行った援助や環境の工夫、そのときの反応を記録します。</span>
          </label>
          
        
          
          <label class="block text-sm font-medium text-slate-700 md:col-span-1">気付き・振り返り
            <textarea name="reflection" rows="4" maxlength="5000" class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
            <span class="mt-1 block text-xs font-normal text-slate-500">記録から読み取れる育ちや気付きを記録します。</span>
          </label>
          
        
          
          <label class="block text-sm font-medium text-slate-700 ">次に意識したいこと
            <textarea name="next_focus" rows="4" maxlength="5000" class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
            <span class="mt-1 block text-xs font-normal text-slate-500">次に見守りたい姿や試したい関わりを記録します。</span>
          </label>
          
        
          
          <fieldset class="md:col-span-2"><legend class="text-sm font-medium text-slate-700">記録区分</legend><div class="mt-2 flex flex-wrap gap-2"><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="日常の姿"> 日常の姿</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="成長・変化"> 成長・変化</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="興味・遊び"> 興味・遊び</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="友達との関わり"> 友達との関わり</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="生活習慣"> 生活習慣</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="健康・発達"> 健康・発達</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="家庭との共有"> 家庭との共有</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="保育者の援助と反応"> 保育者の援助と反応</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="配慮事項"> 配慮事項</label><label class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs"><input type="checkbox" name="categories" value="引継ぎ事項"> 引継ぎ事項</label></div></fieldset>
          
        
          
          <fieldset class="md:col-span-2"><legend class="text-sm font-medium text-slate-700">領域・視点</legend><div class="mt-2 flex flex-wrap gap-2"><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="健やかに伸び伸びと育つ"> 健やかに伸び伸びと育つ</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="身近な人と気持ちが通じ合う"> 身近な人と気持ちが通じ合う</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="身近なものと関わり感性が育つ"> 身近なものと関わり感性が育つ</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="健康"> 健康</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="人間関係"> 人間関係</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="環境"> 環境</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="言葉"> 言葉</label><label class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs"><input type="checkbox" name="perspective_tags" value="表現"> 表現</label></div></fieldset>
          
        
          
          <label class="block text-sm font-medium text-slate-700">取扱区分
            <select name="sensitivity" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2"><option value="normal" selected>通常</option><option value="restricted">取扱注意（共有先を指定）</option></select>
          </label>
          
        
          
          <label class="block text-sm font-medium text-slate-700 md:col-span-2">園独自の必須項目（見本） <span class="text-rose-600">*</span>
            <textarea name="custom_mock" rows="3" maxlength="5000" required class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
          </label>
          
        
      </div>
    </section>

    

    <div class="flex flex-wrap justify-between gap-3">
      <a href="#" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm text-slate-700 hover:bg-slate-50" data-original-href="/children/1/records">キャンセル</a>
      <button type="submit" class="rounded-xl bg-indigo-600 px-6 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">記録を保存</button>
    </div>
  </form>

  
</div>
<dialog id="record-action-dialog" class="w-[min(92vw,30rem)] rounded-xl p-5 shadow-xl backdrop:bg-slate-900/40" aria-labelledby="record-action-message">
  <p id="record-action-message" class="mb-5 font-semibold"></p>
  <div class="flex justify-end gap-3"><button type="button" data-record-stay class="rounded border px-4 py-2">入力に戻る</button><button type="button" data-record-proceed class="rounded bg-indigo-600 px-4 py-2 text-white">続ける</button></div>
</dialog>
</main><dialog id="mock-result"><h2 tabindex="-1">確認用の保存結果</h2><p></p><details><summary>仮保存した入力を確認</summary><dl></dl></details><button type="button" id="mock-edit">入力・修正へ戻る</button></dialog>
<dialog id="mock-leave"><h2>確認用画面の移動</h2><p>未保存の見本入力を残して続けますか？</p><button type="button" data-stay>入力を続ける</button><button type="button" data-discard>見本入力を破棄して戻る</button></dialog>
</body></html>
