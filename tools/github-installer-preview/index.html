<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>GitHubから最新版を導入する操作モック | オープン保育ICT</title>
  <link rel="stylesheet" href="style.css">
  <script src="wizard.js" defer></script>
</head>
<body>
  <aside class="review-tools" aria-label="確認用の操作">
    <div><strong>変更確認用モック</strong><span>版番号・通信・導入はすべて架空です。ダウンロード・保存・送信は行いません。</span></div>
    <div class="review-selects">
      <label>OS表示<select id="os"><option value="windows">Windows 11 x64</option><option value="linux">Ubuntu版が未公開の場合</option></select></label>
      <label>試す状態<select id="scenario"><option value="empty">はじめから</option><option value="partial">一部入力</option><option value="filled">入力済み</option><option value="invalid">入力エラー</option><option value="offline">最新版の確認に失敗</option><option value="unpublished">配布版が未公開</option><option value="outdated">導入アプリの更新が必要</option><option value="download">ダウンロード中に切断</option><option value="integrity">配布ファイルの確認に失敗</option><option value="changed">確認後に新しい版を公開</option><option value="failure">保存場所のエラー</option><option value="existing">すでに導入済み</option></select></label>
    </div>
  </aside>
  <header class="brand"><span class="brand-mark" aria-hidden="true">育</span><div>オープン保育ICT<small>かんたん導入</small></div><span class="beta-tag">β版・試用</span></header>
  <main class="layout">
    <aside class="guide"><p class="eyebrow">はじめる準備を、ひとつずつ。</p><h1>検証済みの最新版を、<br>このPCへ。</h1><p>GitHubから必要なものを<br>まとめて取り寄せます。</p><ol id="steps" aria-label="導入の手順"></ol><div class="guide-note">これまでと同じ、このPCでの試用です。<br>Python・Gitの個別導入は不要です。</div></aside>
    <section class="card" id="wizard" aria-label="導入ウィザード"></section>
  </main>
  <footer class="page-footer">確認用の画面です。実際の名前・メールアドレス・パスワードは入力しないでください。<br>上の「OS表示」「試す状態」は確認用で、導入アプリには表示しません。</footer>
  <dialog id="cancel-dialog" aria-labelledby="cancel-title"><h2 id="cancel-title">いったん中断しますか？</h2><p id="cancel-text"></p><div class="buttons"><button type="button" id="keep-working" class="secondary">続ける</button><button type="button" id="confirm-cancel" class="primary">中断する</button></div></dialog>
</body>
</html>
