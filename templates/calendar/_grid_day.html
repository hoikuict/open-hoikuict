<section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
  <header class="mb-4">
    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">日表示</p>
    <h2 class="text-2xl font-semibold text-slate-900">{{ day_title }}</h2>
    <a href="/calendar?mode=month&date={{ anchor.isoformat() }}"
       hx-get="/calendar/view?mode=month&date={{ anchor.isoformat() }}" hx-target="#calendar-main" hx-swap="outerHTML"
       class="mt-2 inline-block rounded-lg border border-slate-300 px-4 py-2 text-sm text-indigo-700">月表示に戻る</a>
    {% if not day_map[anchor] %}<p class="mt-4 text-slate-500">この日の予定はありません。</p>{% endif %}
  </header>

  <div class="space-y-3">
    <div>
      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">終日</p>
      <div class="space-y-2">
        {% for item in day_map[anchor] if item.is_all_day %}
        <button
          hx-get="/events/{{ item.source_event_id }}?original_start_at={{ item.original_start_at | urlencode }}&mode={{ mode }}&date={{ anchor.isoformat() }}"
          hx-target="#event-modal"
          hx-swap="innerHTML"
          class="w-full rounded-2xl px-3 py-2 text-left text-sm font-medium text-white"
          style="background-color: {{ item.color }};"
        >
          {{ item.title }}
        </button>
        {% endfor %}
      </div>
    </div>

    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500">時間指定の予定</p>
      <div class="space-y-2">
        {% for item in day_map[anchor] if not item.is_all_day %}
        <button hx-get="/events/{{ item.source_event_id }}?original_start_at={{ item.original_start_at | urlencode }}&mode={{ mode }}&date={{ anchor.isoformat() }}"
                hx-target="#event-modal" hx-swap="innerHTML"
                class="w-full rounded-xl px-4 py-4 text-left text-sm font-medium text-white"
                style="background-color: {{ item.color }};">
          <div class="font-semibold">{{ item.title }}</div>
          <div class="mt-1">{% if item.local_start.date() < anchor %}前日以前から継続 ／ {% endif %}{{ item.time_label }}{% if item.local_end.date() > anchor %} ／ 翌日以降まで{% endif %}</div>
        </button>
        {% else %}<p class="text-sm text-slate-500">時間指定の予定はありません。</p>{% endfor %}
      </div>
    </div>
  </div>
</section>
