<div class="col-span-full grid gap-4 md:grid-cols-2">
  {% for meal, title in meal_dates(target_day) %}
  <section aria-labelledby="{{ meal }}-heading" class="rounded-lg border bg-slate-50 p-4">
    <h2 id="{{ meal }}-heading" class="font-semibold">{{ title }}</h2>
    <fieldset class="mt-3">
      <legend class="mb-2">食欲</legend>
      <div class="grid grid-cols-2 gap-2">
        {% for value in appetites %}
        <label class="flex min-h-11 cursor-pointer items-center gap-2 rounded-lg border bg-white p-2 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50">
          <input type="radio" name="{{ meal }}_appetite" value="{{ value }}" {% if form_data.get(meal ~ '_appetite') == value %}checked{% endif %}>{{ value }}
        </label>
        {% endfor %}
      </div>
      <button type="button" data-clear-appetite class="mt-1 text-sm text-indigo-700 underline" {% if not form_data.get(meal ~ '_appetite') %}hidden{% endif %}>選択を消す</button>
    </fieldset>
    <label class="mt-3 block">食べたもの<textarea name="{{ meal }}_contents" maxlength="1000" rows="2" class="mt-1 block w-full rounded border px-3 py-2" placeholder="{{ 'ごはん、焼き魚など' if meal == 'dinner' else 'トースト、バナナなど' }}">{{ form_data.get(meal ~ '_contents', '') }}</textarea></label>
    {% if meal == 'breakfast' and entry and entry.breakfast_status %}<p class="mt-2 text-sm">以前の記録（朝食・食欲）：{{ entry.breakfast_status }}</p>{% endif %}
  </section>
  {% endfor %}
</div>
<script>
document.querySelectorAll('[data-clear-appetite]').forEach(button => {
  const group = button.closest('fieldset');
  group.addEventListener('change', () => { button.hidden = false; });
  button.addEventListener('click', () => {
    const radio = group.querySelector(':checked');
    if (radio) { radio.checked = false; radio.focus(); }
    button.hidden = true;
  });
});
</script>
