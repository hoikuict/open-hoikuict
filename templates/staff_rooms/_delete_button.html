{% if can_delete_message(deletable_message, current_user) %}
<form method="post" action="/staff-rooms/messages/{{ deletable_message.id }}/delete" onsubmit="return confirm('この投稿を削除します。返信は残ります。よろしいですか？')">
  <button type="submit" class="rounded-full border border-rose-200 px-3 py-1.5 text-xs text-rose-700 hover:bg-rose-50">削除</button>
</form>
{% endif %}
