{% extends "parent_auth/base.html" %}
{% block title %}本人情報の確認{% endblock %}
{% block content %}
<h1>本人情報の確認</h1><p class="muted">園に届け出たカナまたは英字の表記で入力してください。漢字氏名は使用しません。</p>
{% if form_error %}<p class="error">{{ form_error }}</p>{% endif %}
<form method="post" action="/parent-portal/register/identity">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label>園に登録した保護者氏名（カナまたは英字）<input name="guardian_name" required maxlength="200" autocomplete="off"></label>
  <label>園に登録した園児氏名（カナまたは英字）<input name="child_name" required maxlength="200" autocomplete="off"></label>
  <label>園児の生年月日<input type="date" name="child_birth_date" required autocomplete="off"></label>
  <button type="submit">園へ確認を依頼する</button>
</form>
{% endblock %}
