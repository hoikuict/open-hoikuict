{% extends "base.html" %}
{% block title %}認証コード発行{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl space-y-6">
  <header>
    <p class="text-sm font-semibold text-indigo-600">保護者認証管理</p>
    <h1 class="mt-1 text-2xl font-bold text-slate-900">コードを発行しました</h1>
    <p class="mt-2 text-sm text-slate-600">{{ account.display_name }}さんへ、本人確認済みの方法で交付してください。この画面を閉じるとコードは再表示できません。</p>
  </header>

  <section class="rounded-xl border border-amber-200 bg-amber-50 p-6 text-center shadow-sm">
    <p class="text-sm font-semibold text-amber-800">発行された認証コード</p>
    <div id="credential-action-code" class="mt-3 select-all break-all font-mono text-3xl font-bold tracking-[0.25em] text-slate-900">{{ action_code }}</div>
  </section>

  <div class="flex flex-wrap gap-2">
    <a href="/parent-accounts/{{ account.id }}/authentication" class="rounded bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">認証管理へ戻る</a>
    <a href="/parent-accounts/" class="rounded border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">保護者一覧へ戻る</a>
  </div>
</div>
{% endblock %}
