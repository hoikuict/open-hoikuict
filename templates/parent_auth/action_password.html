{% extends "parent_auth/base.html" %}
{% block title %}パスワード設定{% endblock %}
{% block content %}
<h1>{% if purpose == 'parent_activate' %}初回パスワード設定{% else %}パスワード再設定{% endif %}</h1>
{% if form_error %}<p class="error">{{ form_error }}</p>{% endif %}
<form method="post" action="/parent-portal/{{ 'activate' if purpose == 'parent_activate' else 'reset' }}/complete">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label>新しいパスワード<input type="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password" data-password-field></label>
  <label>確認用パスワード<input type="password" name="password_confirmation" minlength="8" maxlength="128" required autocomplete="new-password" data-password-field></label>
  <label class="password-visibility"><input type="checkbox" data-password-toggle><span>入力したパスワードを表示</span></label>
  <button type="submit">{% if purpose == 'parent_activate' %}設定する{% else %}再設定する{% endif %}</button>
</form>
{% endblock %}
