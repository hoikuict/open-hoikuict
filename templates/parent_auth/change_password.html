{% extends "parent_auth/base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block content %}
<h1>パスワード変更</h1>{% if form_error %}<p class="error">{{ form_error }}</p>{% endif %}
<form method="post" action="/parent-portal/account/password">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label>現在のパスワード<input type="password" name="current_password" required autocomplete="current-password" data-password-field></label>
  <label>新しいパスワード<input type="password" name="new_password" minlength="8" maxlength="128" required autocomplete="new-password" data-password-field></label>
  <label>確認用パスワード<input type="password" name="password_confirmation" minlength="8" maxlength="128" required autocomplete="new-password" data-password-field></label>
  <label class="password-visibility"><input type="checkbox" data-password-toggle><span>入力したパスワードを表示</span></label>
  <button type="submit">変更する</button>
</form>
{% endblock %}
