{% extends "base.html" %}
{% block title %}出欠確認 | open-hoikuict{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/attendance-compact.css?v=20260925-2">
<div class="attendance-compact attendance-checks-page">
  <header class="compact-head"><div><h1>出欠確認</h1><p>全園児の打刻・連絡・目視確認</p></div><a data-roster-link href="/attendance-checks/roster?date={{ target_date_value }}">名前一覧へ</a></header>
  <form
    method="get"
    action="/attendance-checks/"
    class="compact-toolbar"
    hx-get="/attendance-checks/"
    hx-target="#attendance-checks-board"
    hx-swap="outerHTML"
    hx-push-url="true"
  >
    <div class="compact-filters">
      <div>
        <label for="checks-date" class="mb-1 block text-sm font-medium text-slate-600">日付</label>
        <input type="date" id="checks-date" name="date" value="{{ target_date_value }}" class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label for="checks-layout" class="mb-1 block text-sm font-medium text-slate-600">表示形態</label>
        <select id="checks-layout" name="layout" class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
          {% for option in layout_options %}
          <option value="{{ option.value }}" {% if selected_layout == option.value %}selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="checks-filter" class="mb-1 block text-sm font-medium text-slate-600">絞り込み</label>
        <select id="checks-filter" name="filter" class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
          {% for option in status_filter_options %}
          <option value="{{ option.value }}" {% if selected_filter == option.value %}selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="checks-classroom_id" class="mb-1 block text-sm font-medium text-slate-600">クラス</label>
        <select id="checks-classroom_id" name="classroom_id" class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
          <option value="">すべて</option>
          {% for classroom in classrooms %}
          <option value="{{ classroom.id }}" {% if selected_classroom_id == classroom.id %}selected{% endif %}>{{ classroom.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full rounded bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-800">表示</button>
      </div>
    </div>
  </form>

  <p id="verification-inline-error" role="alert" class="text-sm text-rose-700"></p>
  {% include "attendance_checks/_board.html" %}
</div>

<dialog id="verification-dialog" class="rounded-xl p-5 shadow-xl backdrop:bg-slate-900/40 w-[min(92vw,32rem)]">
  <form id="verification-confirm" class="space-y-4">
    <h2 id="verification-title" class="font-bold text-lg"></h2>
    <div class="flex gap-2"><button type="button" data-reason-preset="誤入力" class="rounded border px-3 py-2">誤入力</button><button type="button" data-reason-preset="変更連絡あり" class="rounded border px-3 py-2">変更連絡あり</button></div>
    <label class="block text-sm">理由 <span id="verification-required"></span><textarea id="verification-reason" rows="3" maxlength="500" class="mt-1 w-full rounded border p-2"></textarea></label>
    <p class="text-sm text-slate-600">記録者: {{ current_user.name }}。日時・変更前後の内容とともに残ります。</p>
    <label id="verification-notify-label" class="block text-sm" hidden><input type="checkbox" id="verification-notify"> 保護者に出欠確認の通知を送る</label>
    <p id="verification-error" role="alert" class="text-sm text-rose-700"></p>
    <div class="flex justify-end gap-3"><button type="button" onclick="document.getElementById('verification-dialog').close()" class="rounded border px-4 py-2">戻る</button><button type="submit" class="rounded bg-indigo-600 px-4 py-2 text-white">記録する</button></div>
  </form>
</dialog>
<script src="/static/js/attendance-checks.js?v=20260925-1" defer></script>
{% endblock %}
