<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>職員ログイン | open-hoikuict</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <section class="w-full max-w-lg text-center" aria-labelledby="login-prompt-title">
      <p class="text-sm font-semibold uppercase tracking-[0.28em] text-indigo-300">open-hoikuict</p>
      <time
        id="current-time"
        class="mt-8 block text-7xl font-semibold tabular-nums tracking-tight text-white sm:text-8xl"
        datetime="{{ current_time }}"
        data-timezone="{{ timezone_name }}"
      >{{ current_time }}</time>
      <h1 id="login-prompt-title" class="mt-8 text-2xl font-semibold text-white">ログインしてください</h1>
      <a
        href="/staff/login?redirect=/"
        class="mt-8 inline-flex min-h-12 items-center justify-center rounded-2xl bg-indigo-500 px-8 py-3 text-base font-semibold text-white shadow-lg shadow-indigo-950/30 transition hover:bg-indigo-400 focus:outline-none focus:ring-4 focus:ring-indigo-300/50"
      >ログインする</a>
    </section>
  </main>
  <script>
    (() => {
      const clock = document.getElementById("current-time");
      if (!clock) return;
      const timezone = clock.dataset.timezone || "Asia/Tokyo";
      const formatter = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        hourCycle: "h23",
        timeZone: timezone,
      });
      const update = () => {
        const value = formatter.format(new Date());
        clock.textContent = value;
        clock.dateTime = value;
      };
      update();
      window.setInterval(update, 60000);
    })();
  </script>
</body>
</html>
