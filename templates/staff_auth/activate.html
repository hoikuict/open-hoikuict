{% extends "base.html" %}

{% block title %}職員アカウント有効化 | open-hoikuict{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium text-indigo-600">初期設定</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">職員アカウントを有効化</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">管理者から受け取った有効化コードを入力してください。確認後にログインIDとパスワードを設定します。</p>

    {% if form_error %}
    <div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">
      {{ form_error }}
    </div>
    {% endif %}

    <form method="post" action="/staff/activate/check" class="mt-7 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block text-sm font-medium text-slate-700">
        有効化コード
        <input type="text" name="activation_code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="64" required autofocus class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 uppercase tracking-[0.2em]">
      </label>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700">コードを確認して次へ</button>
    </form>

    <a href="/staff/login" class="mt-6 inline-block text-sm font-medium text-indigo-600 hover:underline">ログイン画面へ戻る</a>
  </section>
</div>
{% endblock %}
