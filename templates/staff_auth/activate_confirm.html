{% extends "base.html" %}

{% block title %}職員アカウント初期設定 | open-hoikuict{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium text-indigo-600">初期設定</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">ログイン情報を設定</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">{{ target_name }}さんのログインIDを確認し、必要なら修正してからパスワードを設定してください。</p>

    {% if form_error %}
    <div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">{{ form_error }}</div>
    {% endif %}

    <form method="post" action="/staff/activate" class="mt-7 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="activation_code" value="{{ activation_code }}">
      <label class="block text-sm font-medium text-slate-700">
        ログインID
        <input type="text" name="login_id" value="{{ login_id }}" autocomplete="username" required maxlength="255" autofocus class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
        <span class="mt-2 block text-xs leading-5 text-slate-500">次回からこのIDを職員ログイン画面へ入力します。</span>
      </label>
      <label class="block text-sm font-medium text-slate-700">
        新しいパスワード
        <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <label class="block text-sm font-medium text-slate-700">
        新しいパスワード（確認）
        <input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700">ログイン情報を設定</button>
    </form>
    <a href="/staff/activate" class="mt-6 inline-block text-sm font-medium text-indigo-600 hover:underline">コード入力へ戻る</a>
  </section>
</div>
{% endblock %}
