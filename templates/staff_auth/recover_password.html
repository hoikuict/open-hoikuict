{% extends "base.html" %}
{% block title %}管理者パスワードを再設定 | open-hoikuict{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium text-indigo-600">管理者アカウント</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">新しいパスワードを設定</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">8〜128文字で設定してください。変更すると、これまでログインしていた端末はすべてログアウトします。</p>
    {% if form_error %}<div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800" role="alert">{{ form_error }}</div>{% endif %}
    <p id="recovery-link-message" class="mt-4 text-sm text-slate-600" role="status">メールのリンクを確認しています。</p>
    <form id="recovery-form" method="post" action="/staff/recover-password" class="mt-7 space-y-5" {% if not token %}hidden{% endif %}>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input id="recovery-token" type="hidden" name="token" value="{{ token }}">
      <label class="block text-sm font-medium text-slate-700">新しいパスワード
        <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <label class="block text-sm font-medium text-slate-700">新しいパスワード（確認）
        <input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700">パスワードを再設定</button>
    </form>
    <noscript><p class="mt-4 text-sm text-rose-800">JavaScriptを有効にして、メールのリンクを開き直してください。</p></noscript>
    <a href="/staff/forgot-password" class="mt-6 inline-block text-sm font-medium text-indigo-600 hover:underline">再設定メールをもう一度申請する</a>
    <a href="/staff/login" class="mt-3 block text-sm font-medium text-indigo-600 hover:underline">ログイン画面へ戻る</a>
  </section>
</div>
<script>
(() => {
  const input = document.getElementById('recovery-token');
  const fragment = window.location.hash.slice(1);
  if (fragment) window.history.replaceState(null, '', window.location.pathname);
  if (!input.value && /^[A-Za-z0-9_-]{43}$/.test(fragment)) input.value = fragment;
  const ready = /^[A-Za-z0-9_-]{43}$/.test(input.value);
  document.getElementById('recovery-form').hidden = !ready;
  document.getElementById('recovery-link-message').textContent = ready
    ? 'メールの申請から30分以内に設定を完了してください。'
    : 'メールのリンクを開き直すか、再設定メールをもう一度申請してください。';
})();
</script>
{% endblock %}
