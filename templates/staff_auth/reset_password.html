{% extends "base.html" %}

{% block title %}職員パスワード再設定 | open-hoikuict{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium text-indigo-600">職員認証</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">パスワード再設定</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">管理者から受け取った再設定コードと、新しい8文字以上のパスワードを入力してください。</p>

    {% if form_error %}
    <div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">{{ form_error }}</div>
    {% endif %}

    <form method="post" action="/staff/reset-password" class="mt-7 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block text-sm font-medium text-slate-700">
        再設定コード
        <input type="text" name="reset_code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="64" required autofocus class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 uppercase tracking-[0.2em]">
      </label>
      <label class="block text-sm font-medium text-slate-700">
        新しいパスワード
        <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <label class="block text-sm font-medium text-slate-700">
        新しいパスワード（確認）
        <input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
      </label>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700">パスワードを再設定</button>
    </form>
    <a href="/staff/login" class="mt-6 inline-block text-sm font-medium text-indigo-600 hover:underline">ログイン画面へ戻る</a>
  </section>
</div>
{% endblock %}
